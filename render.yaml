services:
  - type: web
    name: chrona
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chrona-db
          property: connectionString

databases:
  - name: chrona-db
    plan: free
